# 収集の番犬 + リポジトリ生存維持
#
# ■ check (毎日)
#   collect.yml とは別スケジュールで、KV に記録された最終収集時刻を直接読む
#   (scripts/collect.ts --check)。28時間以上更新が無ければ job を失敗させ、
#   GitHub 標準の「ワークフロー失敗メール」で所有者に知らせる。
#   以前はサイトの /api/health/scrape を見ていたが、それだとサイトが止まった
#   瞬間に番犬も「JSON が読めない」で毎日失敗し、肝心の「収集が止まったか」を
#   判別できなかった (2026-11 の Vercel 課金停止時に実際に起きた)。
#   今は収集もサイトから独立しているので、番犬もサイトを見ない。
#
# ■ keepalive (毎月1日)
#   GitHub は公開リポジトリで 60 日間アクティビティが無いと schedule を
#   自動停止する。運用を休んでいる間 (人のコミットが無い間) に collect まで
#   黙って止まるのを防ぐため、月1回だけ生存記録をコミットする。
#   書くのは件数と時刻だけで、観測データ本体は公開リポジトリに出さない
#   (蓄積データは BEATRIP の差別化資産のため)。
name: scrape-watchdog

on:
  schedule:
    - cron: "0 20 * * *"   # check: 毎日 20:00 UTC
    - cron: "0 4 1 * *"    # keepalive: 毎月1日 04:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check collection freshness
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          SCRAPER_MODE: hybrid
        run: npx tsx scripts/collect.ts --check

  keepalive:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write heartbeat
        run: |
          mkdir -p .github
          printf '{\n  "note": "collect/watchdog の schedule を GitHub の60日自動停止から守る月次の生存記録",\n  "at": "%s"\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/heartbeat.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.json
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "chore: 収集ワークフローの生存記録 (自動)"
          git push
